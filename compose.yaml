name: relay-dev
services:
  relay-api:
    image: relay:dev
    build: .
    ports:
      - "127.0.0.1:18081:8080"
    environment:
      RELAY_HTTP_ADDR: :8080
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    mem_limit: 128m
    cpus: 0.5
    restart: "no"
    stop_grace_period: 15s
    logging:
      driver: json-file
      options:
        max-size: "5m"
        max-file: "2"
    healthcheck:
      test: [CMD, wget, --quiet, --spider, http://127.0.0.1:8080/readyz]
      interval: 10s
      timeout: 2s
      retries: 3
